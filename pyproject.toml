[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readiness"
version = "0.1.0"
description = "AI data-readiness scorer: assess a dataset before you build"
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["readiness"]
